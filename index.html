<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Calculadora de Notas - Demo Final</title>
    <style>
      /* Fondo oscuro moderno */
      body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      /* Tarjeta principal estilo "Dark Glass" */
      .container {
        background-color: rgba(30, 41, 59, 0.8);
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        max-width: 420px;
        width: 100%;
      }

      h1 {
        text-align: center;
        color: #60a5fa; /* Azul neón */
        font-size: 28px;
        margin-bottom: 30px;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 2px solid rgba(96, 165, 250, 0.3);
        padding-bottom: 15px;
      }

      /* Filas del formulario */
      .form-group {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        font-weight: 500;
        font-size: 16px;
        color: #cbd5e1;
      }

      /* Cuadros de texto oscuros */
      input[type="number"] {
        width: 90px;
        padding: 10px 15px;
        background-color: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        color: #ffffff;
        font-size: 16px;
        outline: none;
        transition: all 0.3s ease;
      }

      input[type="number"]:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
      }

      /* Botones modernos */
      .botones {
        display: flex;
        gap: 15px;
        margin-top: 30px;
      }

      button {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
      }

      button:active {
        transform: translateY(2px);
      }

      .btn-calcular {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
      }

      .btn-calcular:hover {
        background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
      }

      .btn-limpiar {
        background-color: #334155;
        color: #f8fafc;
      }

      .btn-limpiar:hover {
        background-color: #475569;
      }

      /* Área de resultados */
      #resultado {
        text-align: center;
        margin-top: 30px;
        font-size: 22px;
        font-weight: bold;
        min-height: 30px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>App DevOps v2.0</h1>

      <div class="form-group">Nota 1 (10%): <input type="number" id="n1" placeholder="0" /></div>
      <div class="form-group">Nota 2 (20%): <input type="number" id="n2" placeholder="0" /></div>
      <div class="form-group">Nota 3 (30%): <input type="number" id="n3" placeholder="0" /></div>
      <div class="form-group">Nota 4 (40%): <input type="number" id="n4" placeholder="0" /></div>

      <div class="botones">
        <button class="btn-calcular" onclick="calcular()">Calcular</button>
        <button class="btn-limpiar" onclick="limpiar()">Limpiar</button>
      </div>

      <h2 id="resultado"></h2>
    </div>

    <script src="app.js"></script>

    <script>
      function calcular() {
        const n1 = parseFloat(document.getElementById('n1').value);
        const n2 = parseFloat(document.getElementById('n2').value);
        const n3 = parseFloat(document.getElementById('n3').value);
        const n4 = parseFloat(document.getElementById('n4').value);

        try {
          const resultado = calcularPromedioPonderado(n1, n2, n3, n4);
          
          document.getElementById('resultado').innerText = 'Promedio: ' + resultado;
          
          // Colores de alto contraste para el modo oscuro
          if (resultado >= 50.5) {
            document.getElementById('resultado').innerText += ' - APROBADO';
            document.getElementById('resultado').style.color = '#4ade80'; // Verde neón
          } else {
            document.getElementById('resultado').innerText += ' - REPROBADO';
            document.getElementById('resultado').style.color = '#f87171'; // Rojo neón
          }
        } catch (error) {
          document.getElementById('resultado').innerText = error.message;
          document.getElementById('resultado').style.color = '#f87171';
        }
      }

      function limpiar() {
        document.getElementById('n1').value = '';
        document.getElementById('n2').value = '';
        document.getElementById('n3').value = '';
        document.getElementById('n4').value = '';
        document.getElementById('resultado').innerText = '';
      }
    </script>
  </body>
</html>
